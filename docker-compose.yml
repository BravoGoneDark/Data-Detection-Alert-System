services:
  postgres:
    image: postgres:16-alpine
    container_name: ddas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ddas_user
      POSTGRES_PASSWORD: ddas_dev_password
      POSTGRES_DB: ddas_db
    ports:
      - "5432:5432"
    volumes:
      - ddas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddas_user -d ddas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ddas_network

  redis:
    image: redis:7-alpine
    container_name: ddas_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - ddas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ddas_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddas_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ddas_user:ddas_dev_password@postgres:5432/ddas_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: 7494f3a246300fb9ae5ee8c5ac9e771ca281f612908cada44d30e513c812201e
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      STORAGE_BASE_DIR: /app/storage/cas
    ports:
      - "8000:8000"
    volumes:
      - ddas_cas_data:/app/storage/cas
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ddas_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ddas_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ddas_network

volumes:
  ddas_pg_data:
  ddas_redis_data:
  ddas_cas_data:

networks:
  ddas_network:
    driver: bridge