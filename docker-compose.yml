services:
  postgres:
    image: postgres:16
    container_name: ddas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ddas_user
      POSTGRES_PASSWORD: ddas_dev_password
      POSTGRES_DB: ddas_db
    ports:
      - "5432:5432"
    volumes:
      - ddas_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ddas_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - ddas_redis_data:/data

volumes:
  ddas_pg_data:
  ddas_redis_data: